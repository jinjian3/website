name: Build Astro Site

on:
  push:
    branches: [ main ] # 当你推送到 main 分支时自动触发构建

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的强大云端 Linux 服务器运行

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 使用稳定的 Node.js 20 版本，完美支持你的依赖

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline # 云端服务器性能强劲，这里可以顺利安装

      - name: Build project
        run: npm run build # 执行构建，生成 dist 文件夹

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/ # 将构建好的 dist 文件夹作为构建产物保存
